services:
  - type: web
    name: userprotection-api
    env: docker
    plan: free
    region: singapore

    # Vì Dockerfile nằm trong thư mục con
    dockerfilePath: ./UserProtection.API/Dockerfile
    dockerContext: ./

    # Render sẽ ping endpoint này để xác nhận container hoạt động
    healthCheckPath: /health

    autoDeploy: true